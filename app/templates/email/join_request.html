<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Join request for {{ group_title }}</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2933;">
    <h2 style="margin-bottom: 12px;">New join request</h2>
    <p>
      <strong>{{ applicant_name }}</strong> (@{{ applicant_username }}) has requested to join <strong>{{ group_title }}</strong>.
    </p>
    {% if message %}
    <p>
      <strong>Message:</strong><br />
      {{ message }}
    </p>
    {% endif %}
    <p>
      <a
        href="{{ review_url }}"
        style="
          display: inline-block;
          padding: 10px 16px;
          background: #16a34a;
          color: #ffffff;
          text-decoration: none;
          border-radius: 6px;
        "
      >Review Request</a>
    </p>
    <p style="color: #6b7280; font-size: 14px;">
      If you have questions, reply to this email.
    </p>
  </body>
</html>
