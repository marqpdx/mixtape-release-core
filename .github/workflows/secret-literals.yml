# Secret literals — keeps secret values out of this public repository (CTO, 2026-11-17).
# Gate in front of the Argus block public-release-readiness-01. See tools/check_secret_literals.py.
name: secret-literals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checker
        run: python3 -m unittest discover -s tools/tests -p "test_check_secret_literals.py"
      - name: Check secret literals
        run: python3 tools/check_secret_literals.py
