# secret-literals.toml — what tools/check_secret_literals.py lets through, and why.
#
# This repository is public. Every entry here is a decision that a match is not a
# secret: a test fixture, a documented dev-only default, or data that only looks
# random. Each entry needs a `reason`. Keep entries as narrow as they can be: name
# the file, the rule and (for secret-assignment) the setting or argument name.
# Never put a real value here; the checker matches names and paths, not values.
#
# Rules: secret-assignment, private-key-block, aws-access-key, provider-key,
# github-token, slack-token, high-entropy-string, session-handle.

# --- Paths not scanned at all ----------------------------------------------

[[exclude]]
paths = ["tools/eval/**/runs/"]
reason = "Saved model output from eval runs; generated text can look like keys (CTO, 2026-11-17)."

# --- Values that are placeholders wherever they appear ----------------------
# Patterns are matched against a secret-assignment's value (case-insensitive).

[[placeholder]]
patterns = ['dev-only', 'unsafe', 'insecure', 'not-a-', 'changeme', 'placeholder', 'example', '^<.*>$', '^x+$']
reason = "Values that say they are not secrets: dev-only defaults and documentation stand-ins."

[[placeholder]]
patterns = ['^\d+/(s|sec|second|m|min|minute|h|hour|d|day)$']
reason = "Throttle rates (e.g. 30/min) keyed by names such as token_refresh are not secrets."

# --- Named allowances -------------------------------------------------------

[[allow]]
paths = ["app/mixtape/settings/base.py"]
rules = ["secret-assignment"]
names = ["LIVEKIT_API_KEY", "LIVEKIT_API_SECRET"]
reason = "LiveKit's own dev-server defaults (devkey/devsecret); production sets both in the environment."

[[allow]]
paths = ["app/mixtape/settings/dev.py"]
rules = ["secret-assignment"]
names = ["DB_PASSWORD"]
reason = "The local dev database's default password; dev settings only, never loaded in production."

[[allow]]
paths = ["app/accounts/management/commands/create_test_users.py"]
rules = ["secret-assignment"]
names = ["password"]
reason = "Fixed passwords for the local Playwright E2E accounts this command creates."
