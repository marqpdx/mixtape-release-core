<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"{{ piece_title }}" is live</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #0077B5;
            color: white;
            padding: 28px 24px;
            border-radius: 8px 8px 0 0;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .content {
            background-color: #f9fafb;
            padding: 28px 24px;
            border-radius: 0 0 8px 8px;
        }
        .post-copy-box {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin: 20px 0;
            font-size: 15px;
            color: #374151;
            white-space: pre-wrap;
        }
        .button {
            display: inline-block;
            background-color: #0077B5;
            color: white !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Your article is live</h1>
    </div>

    <div class="content">
        <p><strong>{{ piece_title }}</strong> just published.</p>

        {% if post_copy %}
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 4px;">Your LinkedIn post copy:</p>
        <div class="post-copy-box">{{ post_copy }}</div>
        {% endif %}

        <div style="text-align: center; margin: 28px 0 16px;">
            <a href="{{ linkedin_share_url }}" class="button">
                Share on LinkedIn →
            </a>
        </div>

        {% if piece_url %}
        <p style="font-size: 13px; color: #6b7280; text-align: center;">
            <a href="{{ piece_url }}" style="color: #0077B5;">View article</a>
        </p>
        {% endif %}
    </div>

    <div class="footer">
        <p>Mixtape</p>
    </div>
</body>
</html>
