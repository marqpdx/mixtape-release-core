version: "3"

# Local-only Bridge lab. Do not use in production.
# Start: docker compose -f docker/livekit-local.yml up
#
# Redis is on port 6380 to avoid collision with the existing Celery Redis on 6379.
# If you prefer to share the existing Redis, remove the redis service and set:
#   LIVEKIT_KEYS=devkey:devsecret in livekit's environment, pointing to localhost:6379.

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"   # HTTP / WebSocket signaling
      - "7881:7881"   # TURN/TLS (unused in --dev mode)
      - "7882:7882/udp"  # RTP media
    environment:
      - LIVEKIT_KEYS=devkey:devsecret
      - REDIS_ADDRESS=redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
